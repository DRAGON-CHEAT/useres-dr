<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon TV Services</title>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a1a; padding: 40px; border-radius: 15px; box-shadow: 0 0 30px rgba(255, 0, 0, 0.4); width: 350px; text-align: center; border-top: 5px solid #ff0000; }
        h1 { color: #ff0000; font-size: 2.2rem; margin-bottom: 5px; text-transform: uppercase; }
        .subtitle { color: #777; font-size: 0.8rem; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; outline: none; text-align: center; }
        input:focus { border-color: #ff0000; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-send { background: #ff0000; color: white; }
        .btn-login { background: #333; color: white; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="card">
    <h1>Dragon TV</h1>
    <div class="subtitle">Premium Services</div>
    
    <input type="text" id="username" placeholder="الاسم الثنائي والمواليد">
    <input type="password" id="password" placeholder="كلمة المرور">
    
    <div class="btn-group">
        <button class="btn-send" onclick="sendToFirebase()">ارسال الطلب</button>
        <button class="btn-login" onclick="loginCheck()">تسجيل دخول</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, set, get } from "https://gstatic.com";

    // إعداداتك التي أرفقتها (متصلة الآن)
    const firebaseConfig = {
        apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebasedatabase.app",
        projectId: "drag-9user",
        storageBucket: "drag-9user.firebasestorage.app",
        messagingSenderId: "716759119906",
        appId: "1:716759119906:web:4b522ed58dba7bf623727b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // وظيفة إرسال الطلب وإضافة المستخدم بالهيكل المطلوب
    window.sendToFirebase = async () => {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();

        if (!user || !pass) { alert("يرجى إكمال الحقول!"); return; }

        // المرجع في الداتا بيس داخل نود users
        const userRef = ref(db, 'users/' + user);

        try {
            await set(userRef, {
                "username": user,
                "password": pass,
                "currentDevice": "waiting-activation", // قيمة افتراضية حتى يتصل من التطبيق
                "expirydate": "pending" // بانتظار التفعيل
            });

            alert("تم إرسال طلبك بنجاح! يرجى مراسلتنا لتفعيل اشتراكك.");
        } catch (e) {
            alert("فشل الاتصال بالقاعدة، تأكد من الـ Rules في فايربيس");
        }
    };

    // وظيفة تسجيل الدخول
    window.loginCheck = async () => {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        
        const snapshot = await get(ref(db, 'users/' + user));
        if (snapshot.exists() && snapshot.val().password == pass) {
            alert("تم تسجيل الدخول! تاريخ الانتهاء: " + snapshot.val().expirydate);
        } else {
            alert("المعلومات خاطئة أو الحساب غير موجود");
        }
    };
</script>

</body>
</html>
