<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Dragon TV Services</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
body { background-color: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }

#loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 9999;
}
.spinner {
    width: 50px; height: 50px; border: 5px solid #222;
    border-top: 5px solid #ff0000; border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.dragon-card { 
    display: none; 
    background: #111; 
    padding: 40px 20px 60px 20px; 
    border-radius: 15px; 
    border-top: 4px solid #ff0000; 
    width: 90%; 
    max-width: 450px; 
    text-align: center; 
    box-shadow: 0 0 25px rgba(255,0,0,0.3); 
    position: relative;
}

h1 { color: #ff0000; margin-bottom: 25px; text-shadow: 0 0 10px #ff0000; font-size: 2em; }

input { 
    width: 100%; 
    padding: 16px; 
    margin-bottom: 12px; 
    background: #222; 
    border: 1px solid #444; 
    color: white; 
    border-radius: 10px; 
    box-sizing: border-box; 
    text-align: center; 
    outline: none; 
    font-size: 1.1em;
}

.btns { display: flex; gap: 10px; margin-bottom: 12px; }
button { flex: 1; padding: 16px; cursor: pointer; font-weight: bold; border-radius: 10px; border: none; transition: 0.3s; outline: none; font-size: 1.1em; }

.btn-reg { background: #353570; color: white; }
.btn-log { background: #3a7035; color: white; }
.btn-out { background: #b00; color: white; display: none; width: 100%; outline: none; }

#statusMsg { margin-top: 20px; font-size: 15px; min-height: 20px; }

/* أيقونات واتساب وتيليجرام فقط، أقصى يسار */
.contact-icons {
    display: flex; justify-content: flex-start; gap: 8px; 
    position: absolute; top: 10px; left: 10px;
}
.contact-icons a {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    background-size: cover; background-position: center;
    transition: 0.3s; text-decoration: none;
    font-size: 1.2em; color: white;
}

/* ستايل التركيز الخاص بالريموت */
.tv-focusable:focus {
    border: 2px solid #ff0000 !important;
    box-shadow: 0 0 18px #ff0000 !important;
    transform: scale(1.03);
}

/* responsive adjustments */
@media(max-width:600px) {
    .dragon-card { padding: 30px; width: 95%; }
    input, button { font-size: 1em; padding: 14px; }
    .contact-icons a { width: 24px; height: 24px; font-size: 1em; }
}
</style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="margin-top:15px; color:#fff; font-size:18px;">جاري التحقق..</p>
</div>

<div class="dragon-card" id="mainCard">
    <h1>DraGon TV</h1>
    
    <input type="text" id="userField" class="tv-focusable" placeholder="الاسم الثنائي والمواليد" readonly>
    <input type="password" id="passField" class="tv-focusable" placeholder="كلمة المرور" readonly>
    
    <div id="mainBtns" class="btns">
        <button id="regBtn" class="btn-reg tv-focusable" onclick="register()">ارسال الطلب</button>
        <button id="logBtn" class="btn-log tv-focusable" onclick="login()">تسجيل دخول</button>
    </div>
    <button id="outBtn" class="btn-out tv-focusable" onclick="clearDeviceSession()">تسجيل خروج من الحساب</button>
    
    <div id="statusMsg"></div>

    <!-- أيقونات واتساب وتيليجرام فقط -->
    <div class="contact-icons">
        <a href="https://wa.me/1234567890" target="_blank" title="واتساب">💬</a>
        <a href="https://t.me/username" target="_blank" title="تيليجرام">📨</a>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
  authDomain: "drag-9user.firebaseapp.com",
  databaseURL: "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "drag-9user",
  storageBucket: "drag-9user.firebasedatabase.app",
  messagingSenderId: "716759119906",
  appId: "1:716759119906:web:4b522ed58dba7bf623727b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function generateRandomID() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = "DRG-" + Math.floor(Math.random() * 1000000000) + "-" + Math.floor(Math.random() * 1000000000);
        localStorage.setItem('deviceId', id);
    }
    return id;
}
const deviceId = generateRandomID();

function showUI() {
    document.getElementById('loader').style.display = "none";
    document.getElementById('mainCard').style.display = "block";
    updateFocusableElements(); 
}

window.clearDeviceSession = function() {
    const user = localStorage.getItem("user");
    const msg = document.getElementById('statusMsg');
    if (user) {
        db.ref("users/" + user).once("value").then((snap) => {
            const data = snap.val();
            if (data && data.currentDevice === deviceId) {
                db.ref("users/" + user + "/currentDevice").set("").then(() => {
                    localStorage.clear();
                    alert("تم تسجيل الخروج بنجاح.");
                    if(window.Android) { window.Android.closeWindow(); } else { location.reload(); }
                });
            } else {
                msg.style.color = "orange";
                msg.innerText = "⚠ الجهاز غير مطابق لهذا الحساب";
            }
        });
    }
};

window.onload = function() {
    showUI();
};

// ==========================================
// نظام التحكم بالريموت (TV Navigation System)
// ==========================================
let focusableElements = [];
let currentIndex = 0;

function updateFocusableElements() {
    focusableElements = Array.from(document.querySelectorAll('.tv-focusable')).filter(el => {
        return window.getComputedStyle(el).display !== 'none' && window.getComputedStyle(el.parentElement).display !== 'none';
    });
    if(focusableElements.length > 0) {
        currentIndex = 0;
        focusableElements[currentIndex].focus();
    }
}

document.addEventListener('keydown', function(e) {
    if (focusableElements.length === 0) return;

    switch(e.keyCode) {
        case 38: // فوق
            if(currentIndex > 0) currentIndex--;
            break;
        case 40: // تحت
            if(currentIndex < focusableElements.length - 1) currentIndex++;
            break;
        case 37: // يسار
            break; // يمكن تعديل حسب اتجاه التنقل
        case 39: // يمين
            break;
        case 13: // Enter
            const el = focusableElements[currentIndex];
            if(el.tagName === 'INPUT') el.readOnly = false; 
            else el.click();
            break;
        case 4: case 27: // Back
            const active = focusableElements[currentIndex];
            if(active.tagName === 'INPUT') active.readOnly = true;
            else if(window.Android) { window.Android.closeWindow(); }
            break;
    }
    focusableElements[currentIndex].focus();
    e.preventDefault();
});
</script>
</body>
</html>
