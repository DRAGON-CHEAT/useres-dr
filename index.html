<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Dragon TV Services</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { background-color: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dragon-card { background: #111; padding: 30px; border-radius: 15px; border-top: 4px solid #ff0000; width: 320px; text-align: center; box-shadow: 0 0 20px rgba(255,0,0,0.3); }
        h1 { color: #ff0000; margin-bottom: 20px; text-shadow: 0 0 10px #ff0000; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; text-align: center; }
        .btns { display: flex; gap: 5px; }
        button { flex: 1; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 8px; border: none; transition: 0.3s; }
        .btn-reg { background: #ff0000; color: white; }
        .btn-log { background: #333; color: white; }
        .btn-out { background: #b00; color: white; display: none; width: 100%; }
        #statusMsg { margin-top: 15px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

<div class="dragon-card">
    <h1>Dragon TV</h1>
    <input type="text" id="userField" placeholder="الاسم الثنائي والمواليد">
    <input type="password" id="passField" placeholder="كلمة المرور">
    <div id="mainBtns" class="btns">
        <button class="btn-reg" onclick="register()">ارسال الطلب</button>
        <button class="btn-log" onclick="login()">تسجيل دخول</button>
    </div>
    <button id="outBtn" class="btn-out" onclick="clearDeviceSession()">تسجيل خروج من الحساب</button>
    <div id="statusMsg"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
  authDomain: "drag-9user.firebaseapp.com",
  databaseURL: "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "drag-9user",
  storageBucket: "drag-9user.firebasestorage.app",
  messagingSenderId: "716759119906",
  appId: "1:716759119906:web:4b522ed58dba7bf623727b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 1. توليد ايدي عشوائي (رقم-رقم)
function generateRandomID() {
    const r1 = Math.floor(Math.random() * 1000000000);
    const r2 = Math.floor(Math.random() * 1000000000);
    return "DRG-" + r1 + "-" + r2;
}

let deviceId = localStorage.getItem('deviceId');
if (!deviceId) {
    deviceId = generateRandomID();
    localStorage.setItem('deviceId', deviceId);
}

// 2. دالة تسجيل الخروج والمقارنة
window.clearDeviceSession = function() {
    const user = localStorage.getItem("user");
    const msg = document.getElementById('statusMsg');
    if (user) {
        db.ref("users/" + user).once("value").then((snap) => {
            const data = snap.val();
            if (data && data.currentDevice === deviceId) {
                db.ref("users/" + user + "/currentDevice").set("").then(() => {
                    localStorage.clear();
                    alert("تم تسجيل الخروج بنجاح.");
                    if(window.Android) { window.Android.closeWindow(); } else { location.reload(); }
                });
            } else {
                msg.style.color = "orange";
                msg.innerText = "⚠ الجهاز غير مطابق لهذا الحساب";
            }
        });
    }
};

// 3. معالج التحميل (فصل الواجهات)
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const isLogoutMode = urlParams.get('action') === 'logout';
    const savedUser = localStorage.getItem("user");

    if (isLogoutMode && savedUser) {
        document.getElementById('userField').value = savedUser;
        document.getElementById('userField').readOnly = true;
        document.getElementById('passField').style.display = "none";
        document.getElementById('mainBtns').style.display = "none";
        document.getElementById('outBtn').style.display = "block";
    } else if(savedUser) {
        const savedPass = localStorage.getItem("pass");
        document.getElementById('userField').value = savedUser;
        if(savedPass) {
            document.getElementById('passField').value = savedPass;
            processLogin(savedUser, savedPass, true);
        }
    }
};

function register() {
    const user = document.getElementById('userField').value.trim();
    const msg = document.getElementById('statusMsg');
    if(user.length < 8) { msg.innerText = "⚠ الاسم يجب أن يكون ثنائي"; return; }

    db.ref("users/" + user).once("value").then((snap) => {
        if(snap.exists()) {
            msg.innerText = "هذا المستخدم موجود بالفعل";
        } else {
            db.ref("users/" + user).set({
                username: user,
                currentDevice: deviceId,
                expirydate: "",
                password: ""
            }).then(() => {
                msg.style.color = "yellow";
                msg.innerText = "تم إرسال الطلب، يرجى مراسلتنا";
            });
        }
    });
}

function login() {
    const user = document.getElementById('userField').value.trim();
    const pass = document.getElementById('passField').value.trim();
    const msg = document.getElementById('statusMsg');

    if(!user) { msg.innerText = "⚠ يرجى إدخال الاسم"; return; }
    if(!pass) { msg.innerText = "⚠ يرجى إدخال كلمة المرور"; return; }
    
    processLogin(user, pass, false);
}

function processLogin(user, pass, isAuto) {
    const msg = document.getElementById('statusMsg');

    db.ref("users/" + user).once("value").then((snap) => {
        if(snap.exists()){
            const data = snap.val();
            
            if(data.expirydate && new Date(data.expirydate) < new Date()) {
                msg.innerText = "⚠ انتهى اشتراكك";
                return;
            }

            if (!data.currentDevice || data.currentDevice === "") {
                db.ref("users/" + user + "/currentDevice").set(deviceId);
            } else if (data.currentDevice !== deviceId) {
                msg.style.color = "red";
                msg.innerText = "⚠ حسابك مرتبط بجهاز آخر";
                return;
            }

            if(data.password && data.password.toString() === pass) {
                localStorage.setItem("user", user);
                localStorage.setItem("pass", pass);
                if(!isAuto) {
                    msg.style.color = "lime";
                    msg.innerText = "تم التحقق بنجاح..";
                    setTimeout(() => {
                        if(window.Android) { window.Android.closeWindow(); }
                    }, 1000);
                }
            } else {
                if(!isAuto) msg.innerText = "الباسورد خطأ";
            }
        } else {
            if(!isAuto) msg.innerText = "المستخدم غير موجود";
        }
    });
}
</script>
</body>
</html>
