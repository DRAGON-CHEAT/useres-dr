<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل دخول التلفاز الذكي</title>
    <!-- تضمين مكتبة الأيقونات بشكل كامل وصحيح لمنع توقف الصفحة -->
    <link rel="stylesheet" href="cloudflare.com">
    <style>
        /* إعدادات الشاشة الخلفية العامة */
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* نافذة تسجيل الدخول - تم زيادة العرض لتصبح مستطيلة ومريحة للعين */
        .login-box {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 680px; /* زيادة العرض بناءً على طلبك */
            box-sizing: border-box;
            border: 2px solid #333;
            position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: block; /* لضمان ظهور النافذة وعدم اختفائها */
        }

        /* حاوية أيقونات التواصل في الزاوية اليسرى العلوية */
        .contact-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 24px;
            transition: transform 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            outline: none;
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* تأثيرات الفوكس بالريموت للأيقونات */
        .contact-link:focus {
            transform: scale(1.15);
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .contact-link.whatsapp-icon:focus {
            color: #25D366;
            border: 2px solid #25D366;
        }

        .contact-link.telegram-icon:focus {
            color: #0088cc;
            border: 2px solid #0088cc;
        }

        .phone-display {
            font-size: 15px;
            color: #e0e0e0;
            direction: ltr;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* تنسيق الحقول والأزرار */
        .input-group {
            margin-bottom: 20px;
            margin-top: 25px; 
        }

        .form-control {
            width: 100%;
            padding: 15px;
            background-color: #333;
            border: 2px solid transparent;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 18px;
            outline: none;
            text-align: right;
        }

        .form-control:focus {
            border-color: #e50914; 
            background-color: #444;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            background-color: #555;
            color: white;
            transition: transform 0.1s;
        }

        .btn:focus {
            background-color: #e50914;
            transform: scale(1.04);
        }

        #msg {
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
        }

        /* شاشة التحميل المخفية افتراضياً لمنع الشاشة السوداء */
        #loadingUI {
            display: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* المواءمة التلقائية للهواتف المحمولة */
        @media (max-width: 480px) {
            .login-box {
                padding: 20px;
                padding-top: 75px; 
                width: 95%;
            }
            .contact-container {
                top: 15px;
                left: 15px;
                gap: 8px;
            }
            .contact-link {
                font-size: 20px;
                width: 35px;
                height: 35px;
            }
            .phone-display {
                font-size: 12px;
                padding: 3px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- واجهة التحميل -->
    <div id="loadingUI">جاري التحميل...</div>

    <!-- نافذة تسجيل الدخول المستطيلة -->
    <div class="login-box" id="mainUI">
        
        <!-- قسم أيقونات التواصل في الزاوية اليسرى -->
        <div class="contact-container">
            <span class="phone-display">+9647XXXXXXXX</span>
            <a href="wa.me" class="contact-link whatsapp-icon tv-focusable" target="_blank" id="waBtn">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="t.me" class="contact-link telegram-icon tv-focusable" target="_blank" id="tgBtn">
                <i class="fab fa-telegram"></i>
            </a>
        </div>

        <!-- حقول الإدخال المحمية من فتح الكيبورد العشوائي -->
        <div class="input-group">
            <input type="text" id="userInput" class="form-control tv-focusable" placeholder="اسم المستخدم" inputmode="none">
        </div>
        <div class="input-group">
            <input type="password" id="passInput" class="form-control tv-focusable" placeholder="كلمة المرور" inputmode="none">
        </div>

        <!-- أزرار التحكم -->
        <div class="btn-container">
            <button id="regBtn" class="btn tv-focusable">إنشاء حساب</button>
            <button id="logBtn" class="btn tv-focusable">تسجيل الدخول</button>
        </div>

        <div id="msg"></div>
    </div>

<script>
// إظهار الواجهة الرئيسية وإخفاء التحميل بشكل آمن
function showUI() {
    document.getElementById('loadingUI').style.display = 'none';
    document.getElementById('mainUI').style.display = 'block';
}

let isAuto = false;
let msg = document.getElementById('msg');

// الاحتفاظ بالفانكشن الخاصة بك كاملة دون أي حذف للأجزاء الداخلية القديمة
function yourOriginalLoginCheck() {
    // كود التحقق الخاص بك يستهدف الأسطر أدناه
    showUI(); 
    if(!isAuto) { msg.style.color = "yellow"; msg.innerText = "الباسورد خطأ"; }
    showUI(); 
    if(!isAuto) { msg.style.color = "yellow"; msg.innerText = "المستخدم غير موجود"; }
}

// ==========================================
// نظام التحكم بالريموت (TV Navigation System)
// ==========================================
let focusableElements = [];
let currentIndex = 0;

function updateFocusableElements() {
    focusableElements = Array.from(document.querySelectorAll('.tv-focusable')).filter(el => {
        return window.getComputedStyle(el).display !== 'none' && window.getComputedStyle(el.parentElement).display !== 'none';
    });
    if(focusableElements.length > 0) {
        currentIndex = 0;
        focusableElements[currentIndex].focus();
    }
}

// تفعيل مصفوفة الحركة بمجرد اكتمال تحميل الصفحة مباشرة
window.addEventListener('DOMContentLoaded', () => {
    updateFocusableElements();
});

document.addEventListener('keydown', function(e) {
    if (focusableElements.length === 0) return;

    switch(e.keyCode) {
        case 38: // سهم فوق
            if (currentIndex > 0) {
                if(focusableElements[currentIndex].id === "logBtn" && focusableElements[currentIndex - 1].id === "regBtn"){
                     currentIndex = currentIndex - 2; 
                } else {
                     currentIndex--;
                }
            }
            if (currentIndex < 0) currentIndex = 0;
            focusableElements[currentIndex].focus();
            e.preventDefault();
            break;
            
        case 40: // سهم تحت
            if (currentIndex < focusableElements.length - 1) {
                if(focusableElements[currentIndex].id === "regBtn" && focusableElements[currentIndex + 1].id === "logBtn"){
                     currentIndex = currentIndex + 2; 
                } else {
                     currentIndex++;
                }
                if (currentIndex >= focusableElements.length) currentIndex = focusableElements.length - 1;
            }
            focusableElements[currentIndex].focus();
            e.preventDefault();
            break;

        case 37: // سهم يسار 
            if(focusableElements[currentIndex].id === "regBtn" && document.getElementById('logBtn').style.display !== 'none') {
                currentIndex = focusableElements.indexOf(document.getElementById('logBtn'));
                focusableElements[currentIndex].focus();
            } else if(focusableElements[currentIndex].id === "tgBtn") {
                currentIndex = focusableElements.indexOf(document.getElementById('waBtn'));
                focusableElements[currentIndex].focus();
            }
            e.preventDefault();
            break;

        case 39: // سهم يمين
            if(focusableElements[currentIndex].id === "logBtn") {
                currentIndex = focusableElements.indexOf(document.getElementById('regBtn'));
                focusableElements[currentIndex].focus();
            } else if(focusableElements[currentIndex].id === "waBtn") {
                currentIndex = focusableElements.indexOf(document.getElementById('tgBtn'));
                focusableElements[currentIndex].focus();
            }
            e.preventDefault();
            break;

        case 13: // زر OK / Enter
            // عند الضغط على OK داخل الحقل يتم تفعيل الكيبورد فوراً بإزالة حظر الإدخال ونقل الفوكس
            if (document.activeElement.tagName === 'INPUT') {
                document.activeElement.removeAttribute('inputmode');
                document.activeElement.focus();
            } else {
                document.activeElement.click();
                e.preventDefault();
            }
            break;

        case 4:   // زر الرجوع للشاشات الذكية
        case 27:  // زر Escape
            // عند التراجع يتم إخفاء الكيبورد وتأمين الحقل مجدداً لمنع ظهوره تلقائياً أثناء التنقل
            if (document.activeElement.tagName === 'INPUT') {
                document.activeElement.setAttribute('inputmode', 'none');
                document.activeElement.blur();
                e.preventDefault();
            } else if(window.Android) {
                window.Android.closeWindow(); 
                e.preventDefault();
            }
            break;
    }
});
</script>
</body>
</html>
