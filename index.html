<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Dragon TV Services</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { background-color: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #222;
            border-top: 5px solid #ff0000; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* الكارد */
        .dragon-card { 
            display: none; 
            background: #111; 
            padding: 35px 25px 60px 25px; 
            border-radius: 15px; 
            border-top: 4px solid #ff0000; 
            width: 85%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 0 25px rgba(255,0,0,0.3); 
            position: relative;
        }
        
        h1 { color: #ff0000; margin-bottom: 20px; text-shadow: 0 0 10px #ff0000; font-size: 2em; }

        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            background: #222; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 10px; 
            box-sizing: border-box; 
            text-align: center; 
            outline: none; 
            font-size: 1.05em;
        }

        .btns { display: flex; gap: 10px; margin-bottom: 12px; }
        button { flex: 1; padding: 14px; cursor: pointer; font-weight: bold; border-radius: 10px; border: none; transition: 0.3s; outline: none; font-size: 1.05em; }

        .btn-reg { background: #353570; color: white; }
        .btn-log { background: #3a7035; color: white; }
        .btn-out { background: #b00; color: white; display: none; width: 100%; outline: none; }

        #statusMsg { margin-top: 18px; font-size: 14px; min-height: 20px; }

        /* أيقونات واتساب وتيليجرام ورقم الهاتف في الزاوية العليا اليسرى */
        .contact-icons {
            display: flex; gap: 8px; position: absolute; top: 10px; left: 10px;
        }
        .contact-icons a img {
            width: 28px; height: 28px; border-radius: 50%; 
            display: block;
        }
        .contact-icons a:hover img { transform: scale(1.1); transition: 0.2s; }

        /* الفيرجن في الأسفل */
        .version-info { 
            margin-top: 20px; font-size: 12px; color: #aaa; 
        }

        /* ستايل التركيز الخاص بريموت التلفاز */
        .tv-focusable:focus {
            border: 2px solid #ff0000 !important;
            box-shadow: 0 0 15px #ff0000 !important;
            transform: scale(1.03);
        }

        @media(max-width:600px) {
            .dragon-card { padding: 25px 15px 50px 15px; width: 95%; }
            input, button { font-size: 1em; padding: 12px; }
            .contact-icons a img { width: 24px; height: 24px; }
            .version-info { font-size: 11px; }
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="margin-top:15px; color:#fff; font-size:18px;">جاري التحقق..</p>
</div>

<div class="dragon-card" id="mainCard">
    <!-- أيقونات زاوية أعلى يسار -->
    <div class="contact-icons">
        <a href="https://wa.me/1234567890" target="_blank" title="واتساب">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="واتساب">
        </a>
        <a href="https://t.me/username" target="_blank" title="تيليجرام">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="تيليجرام">
        </a>
        <a href="tel:1234567890" title="اتصال">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6d/Phone_font_awesome.svg" alt="هاتف">
        </a>
    </div>

    <h1>DraGon TV</h1>
    
    <input type="text" id="userField" class="tv-focusable" placeholder="الاسم الثنائي والمواليد">
    <input type="password" id="passField" class="tv-focusable" placeholder="كلمة المرور">
    
    <div id="mainBtns" class="btns">
        <button id="regBtn" class="btn-reg tv-focusable" onclick="register()">ارسال الطلب</button>
        <button id="logBtn" class="btn-log tv-focusable" onclick="login()">تسجيل دخول</button>
    </div>
    <button id="outBtn" class="btn-out tv-focusable" onclick="clearDeviceSession()">تسجيل خروج من الحساب</button>
    
    <div id="statusMsg"></div>
    
    <!-- نسخة الفيرجن -->
    <div class="version-info">Version 1.0 - 2026</div>
</div>

<script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
  authDomain: "drag-9user.firebaseapp.com",
  databaseURL: "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "drag-9user",
  storageBucket: "drag-9user.firebasestorage.app",
  messagingSenderId: "716759119906",
  appId: "1:716759119906:web:4b522ed58dba7bf623727b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function generateRandomID() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = "DRG-" + Math.floor(Math.random() * 1000000000) + "-" + Math.floor(Math.random() * 1000000000);
        localStorage.setItem('deviceId', id);
    }
    return id;
}
const deviceId = generateRandomID();

function showUI() {
    document.getElementById('loader').style.display = "none";
    document.getElementById('mainCard').style.display = "block";
    updateFocusableElements(); 
}

window.clearDeviceSession = function() {
    const user = localStorage.getItem("user");
    const msg = document.getElementById('statusMsg');
    if (user) {
        db.ref("users/" + user).once("value").then((snap) => {
            const data = snap.val();
            if (data && data.currentDevice === deviceId) {
                db.ref("users/" + user + "/currentDevice").set("").then(() => {
                    localStorage.clear();
                    alert("تم تسجيل الخروج بنجاح.");
                    if(window.Android) { window.Android.closeWindow(); } else { location.reload(); }
                });
            } else {
                msg.style.color = "orange";
                msg.innerText = "⚠ الجهاز غير مطابق لهذا الحساب";
            }
        });
    }
};

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const isLogoutMode = urlParams.get('action') === 'logout';
    const savedUser = localStorage.getItem("user");
    const savedPass = localStorage.getItem("pass");

    if(savedUser) { document.getElementById('userField').value = savedUser; }

    if (isLogoutMode && savedUser) {
        showUI();
        document.getElementById('userField').readOnly = true;
        document.getElementById('passField').style.display = "none";
        document.getElementById('mainBtns').style.display = "none";
        document.getElementById('outBtn').style.display = "block";
        updateFocusableElements();
    } else if(savedUser && savedPass) {
        processLogin(savedUser, savedPass, true);
    } else {
        showUI();
    }
};

function register() {
    const user = document.getElementById('userField').value.trim();
    const msg = document.getElementById('statusMsg');
    if(!user) { msg.style.color = "yellow"; msg.innerText = "⚠ يرجى إدخال أسم المستخدم أولاً"; return; }
    if(user.length < 8) { msg.style.color = "yellow"; msg.innerText = "⚠  الاسم يجب أن يكون ثنائي مع مواليد"; return; }
    
    db.ref("users/" + user).once("value").then((snap) => {
        if(snap.exists()) { 
            msg.style.color = "red"; msg.innerText = "⚠ هذا المستخدم موجود بالفعل"; 
        } else {
            db.ref("users/" + user).set({ username: user, currentDevice: deviceId, expirydate: "", password: "" }).then(() => {
                msg.style.color = "yellow"; msg.innerText = "تم إرسال طلبك بنجاح يرجى مراسلتنا";
            });
        }
    });
}

function login() {
    const user = document.getElementById('userField').value.trim();
    const pass = document.getElementById('passField').value.trim();
    const msg = document.getElementById('statusMsg');
    if(!user) { msg.style.color = "yellow"; msg.innerText = "⚠ يرجى إدخال اسم المستخدم"; return; }
    if(!pass) { msg.style.color = "yellow"; msg.innerText = "⚠ يرجى إدخال كلمة المرور"; return; }
    processLogin(user, pass, false);
}

function processLogin(user, pass, isAuto) {
    const msg = document.getElementById('statusMsg');
    db.ref("users/" + user).once("value").then((snap) => {
        if(snap.exists()){
            const data = snap.val();
            if(data.expirydate && new Date(data.expirydate) < new Date()) {
                showUI();
                msg.style.color = "yellow"; msg.innerText = "⚠ انتهى اشتراكك"; return;
            }
            if (!data.currentDevice || data.currentDevice === "") {
                db.ref("users/" + user + "/currentDevice").set(deviceId);
            } else if (data.currentDevice !== deviceId) {
                showUI();
                msg.style.color = "red"; msg.innerText = "⚠ حسابك مرتبط بجهاز آخر"; return;
            }
            if(data.password && data.password.toString() === pass) {
                localStorage.setItem("user", user);
                localStorage.setItem("pass", pass);
                if(window.Android) { window.Android.closeWindow(); }
            } else {
                showUI(); 
                if(!isAuto) { msg.style.color = "yellow"; msg.innerText = "الباسورد خطأ"; }
            }
        } else {
            showUI(); 
            if(!isAuto) { msg.style.color = "yellow"; msg.innerText = "المستخدم غير موجود"; }
        }
    }).catch(() => showUI());
}

// ==========================================
// نظام التحكم بالريموت (TV Navigation System)
// ==========================================
let focusableElements = [];
let currentIndex = 0;

function updateFocusableElements() {
    focusableElements = Array.from(document.querySelectorAll('.tv-focusable')).filter(el => {
        return window.getComputedStyle(el).display !== 'none' && window.getComputedStyle(el.parentElement).display !== 'none';
    });
    if(focusableElements.length > 0) {
        currentIndex = 0;
        focusableElements[currentIndex].focus();
    }
}

document.addEventListener('keydown', function(e) {
    if (focusableElements.length === 0) return;

    switch(e.keyCode) {
        case 38: // فوق
            if (currentIndex > 0) {
                if(focusableElements[currentIndex].id === "logBtn" && focusableElements[currentIndex - 1].id === "regBtn"){
                     currentIndex = currentIndex - 2;
                } else { currentIndex--; }
            }
            focusableElements[currentIndex].focus();
            e.preventDefault();
            break;
        case 40: // تحت
            if (currentIndex < focusableElements.length - 1) {
                if(focusableElements[currentIndex].id === "regBtn" && focusableElements[currentIndex + 1].id === "logBtn"){
                     currentIndex = currentIndex + 2;
                } else { currentIndex++; }
                if (currentIndex >= focusableElements.length) currentIndex = focusableElements.length - 1;
            }
            focusableElements[currentIndex].focus();
            e.preventDefault();
            break;
        case 37: // يسار
            if(focusableElements[currentIndex].id === "regBtn" && document.getElementById('logBtn').style.display !== 'none') {
                currentIndex = focusableElements.indexOf(document.getElementById('logBtn'));
                focusableElements[currentIndex].focus();
            }
            e.preventDefault();
            break;
        case 39: // يمين
            if(focusableElements[currentIndex].id === "logBtn") {
                currentIndex = focusableElements.indexOf(document.getElementById('regBtn'));
                focusableElements[currentIndex].focus();
            }
            e.preventDefault();
            break;
        case 13: // Enter
            if (document.activeElement.tagName !== 'INPUT') {
                document.activeElement.click();
                e.preventDefault();
            }
            break;
        case 4: case 27: 
            if(window.Android) { window.Android.closeWindow(); e.preventDefault(); }
            break;
    }
});
</script>
</script>
</body>
</html>
