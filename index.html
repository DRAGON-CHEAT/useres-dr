<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Login System</title>
    <!-- استدعاء مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="cloudflare.com">
    <style>
        /* إعدادات الشاشة العامة */
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        /* نافذة تسجيل الدخول - تم زيادة العرض والمراعاة للتلفاز والهاتف */
        .login-box {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 650px; /* زيادة العرض لتصبح مستطيلة بدلاً من مربع */
            box-sizing: border-box;
            border: 2px solid #333;
            position: relative; /* مهم جداً لتموضع أيقونات التواصل */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* حاوية أيقونات التواصل في الزاوية اليسرى العلوية */
        .contact-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 24px;
            transition: transform 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            outline: none;
        }

        /* تأثيرات الفوكس للريموت على أيقونات التواصل */
        .contact-link.whatsapp-icon:focus {
            color: #25D366;
            transform: scale(1.2);
            background-color: rgba(37, 211, 102, 0.1);
        }

        .contact-link.telegram-icon:focus {
            color: #0088cc;
            transform: scale(1.2);
            background-color: rgba(0, 136, 204, 0.1);
        }

        .phone-display {
            font-size: 14px;
            color: #bbb;
            direction: ltr;
            font-weight: bold;
        }

        /* تنسيق الحقول والأزرار */
        .input-group {
            margin-bottom: 20px;
            margin-top: 25px; /* مسافة إضافية لتفادي التداخل مع الأيقونات */
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #333;
            border: 2px solid transparent;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        .form-control:focus {
            border-color: #e50914; /* تغيير اللون حسب رغبتك عند الفوكس */
            background-color: #444;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            background-color: #555;
            color: white;
        }

        .btn:focus {
            background-color: #e50914;
            transform: scale(1.03);
        }

        #msg {
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }

        /* شاشة التحميل الافتراضية */
        #loadingUI {
            display: none;
            color: white;
            font-size: 20px;
        }

        /* استعلامات الوسائط لشاشات الهاتف */
        @media (max-width: 480px) {
            .login-box {
                padding: 20px;
                padding-top: 60px; /* مساحة إضافية للهاتف */
            }
            .contact-container {
                top: 10px;
                left: 10px;
                gap: 8px;
            }
            .contact-link {
                font-size: 20px;
                width: 32px;
                height: 32px;
            }
            .phone-display {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- واجهة التحميل -->
    <div id="loadingUI">جاري التحميل...</div>

    <!-- نافذة تسجيل الدخول المحدثة -->
    <div class="login-box" id="mainUI">
        
        <!-- قسم أيقونات التواصل المضافة حديثاً في الزاوية اليسرى -->
        <div class="contact-container">
            <span class="phone-display">+9647XXXXXXXX</span>
            <a href="wa.me" class="contact-link whatsapp-icon tv-focusable" target="_blank" id="waBtn">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="t.me" class="contact-link telegram-icon tv-focusable" target="_blank" id="tgBtn">
                <i class="fab fa-telegram"></i>
            </a>
        </div>

        <!-- حقول الإدخال -->
        <div class="input-group">
            <input type="text" id="userInput" class="form-control tv-focusable" placeholder="اسم المستخدم" readonly onclick="this.removeAttribute('readonly');">
        </div>
        <div class="input-group">
            <input type="password" id="passInput" class="form-control tv-focusable" placeholder="كلمة المرور" readonly onclick="this.removeAttribute('readonly');">
        </div>

        <!-- أزرار التحكم -->
        <div class="btn-container">
            <button id="regBtn" class="btn tv-focusable">إنشاء حساب</button>
            <button id="logBtn" class="btn tv-focusable">تسجيل الدخول</button>
        </div>

        <div id="msg"></div>
    </div>

<script>
// دالات وهمية لمحاكاة النظام الأصلي لديك (عدلها بما يتوافق مع تطبيقك)
function showUI() {
    document.getElementById('loadingUI').style.display = 'none';
    document.getElementById('mainUI').style.display = 'block';
}
let isAuto = false;
let msg = document.getElementById('msg');

// دالة افتراضية لمحاكاة الجلب والتحقق لمنع أخطاء التشغيل
function loginCheckExample() {
    Promise.resolve().then(() => {
        let userExists = false; 
        let passCorrect = false;
        if (userExists) {
            if (passCorrect) {
                // نجاح
            } else {
                showUI(); 
                if(!isAuto) { msg.style.color = "yellow"; msg.innerText = "الباسورد خطأ"; }
            }
        } else {
            showUI(); 
            if(!isAuto) { msg.style.color = "yellow"; msg.innerText = "المستخدم غير موجود"; }
        }
    }).catch(() => showUI());
}

// ==========================================
// نظام التحكم بالريموت (TV Navigation System)
// ==========================================
let focusableElements = [];
let currentIndex = 0;

function updateFocusableElements() {
    // جلب العناصر الظاهرة فقط للتحكم بها
    focusableElements = Array.from(document.querySelectorAll('.tv-focusable')).filter(el => {
        return window.getComputedStyle(el).display !== 'none' && window.getComputedStyle(el.parentElement).display !== 'none';
    });
    if(focusableElements.length > 0) {
        currentIndex = 0;
        focusableElements[currentIndex].focus();
    }
}

// تشغيل التحديث عند تحميل الصفحة لتفعيل الفوكس تلقائياً
window.addEventListener('DOMContentLoaded', () => {
    updateFocusableElements();
});

document.addEventListener('keydown', function(e) {
    if (focusableElements.length === 0) return;

    switch(e.keyCode) {
        case 38: // سهم فوق
            if (currentIndex > 0) {
                // التعامل مع الأزرار المتجاورة أفقياً أسفل الشاشة
                if(focusableElements[currentIndex].id === "logBtn" && focusableElements[currentIndex - 1].id === "regBtn"){
                     currentIndex = currentIndex - 2; // تخطي الزر المجاور والذهاب للحقل الأعلى
                } else {
                     currentIndex--;
                }
            }
            if (currentIndex < 0) currentIndex = 0;
            focusableElements[currentIndex].focus();
            e.preventDefault();
            break;
            
        case 40: // سهم تحت
            if (currentIndex < focusableElements.length - 1) {
                if(focusableElements[currentIndex].id === "regBtn" && focusableElements[currentIndex + 1].id === "logBtn"){
                     currentIndex = currentIndex + 2; // تخطي الزر المجاور للأسفل
                } else {
                     currentIndex++;
                }
                if (currentIndex >= focusableElements.length) currentIndex = focusableElements.length - 1;
            }
            focusableElements[currentIndex].focus();
            e.preventDefault();
            break;

        case 37: // سهم يسار (للتنقل بين الأزرار المتجاورة والأيقونات)
            if(focusableElements[currentIndex].id === "regBtn" && document.getElementById('logBtn').style.display !== 'none') {
                currentIndex = focusableElements.indexOf(document.getElementById('logBtn'));
                focusableElements[currentIndex].focus();
            } else if(focusableElements[currentIndex].id === "tgBtn") {
                currentIndex = focusableElements.indexOf(document.getElementById('waBtn'));
                focusableElements[currentIndex].focus();
            }
            e.preventDefault();
            break;

        case 39: // سهم يمين (للتنقل بين الأزرار المتجاورة والأيقونات)
            if(focusableElements[currentIndex].id === "logBtn") {
                currentIndex = focusableElements.indexOf(document.getElementById('regBtn'));
                focusableElements[currentIndex].focus();
            } else if(focusableElements[currentIndex].id === "waBtn") {
                currentIndex = focusableElements.indexOf(document.getElementById('tgBtn'));
                focusableElements[currentIndex].focus();
            }
            e.preventDefault();
            break;

        case 13: // زر OK / Enter
            // إذا كان حقل إدخال، يزيل خاصية القراءة فقط للسماح بفتح الكيبورد عند الضغط على OK
            if (document.activeElement.tagName === 'INPUT') {
                document.activeElement.removeAttribute('readonly');
                document.activeElement.focus();
            } else {
                document.activeElement.click();
                e.preventDefault();
            }
            break;

        case 4:   // زر الرجوع في بعض شاشات التلفاز الذكية
        case 27:  // زر Escape من الكيبورد
            // عند الخروج أو التراجع، تتم إعادة حقول الإدخال إلى وضع القراءة فقط لإخفاء الكيبورد
            if (document.activeElement.tagName === 'INPUT') {
                document.activeElement.setAttribute('readonly', 'true');
                document.activeElement.blur();
                e.preventDefault();
            } else if(window.Android) {
                window.Android.closeWindow(); // الخروج عبر كلاس الأندرويد
                e.preventDefault();
            }
            break;
    }
});
</script>
</body>
</html>
