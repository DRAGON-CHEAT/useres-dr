<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Dragon TV Services</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { background-color: #0d0d0d; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px red; width: 320px; text-align: center; }
        h1 { color: red; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .btns { display: flex; gap: 5px; }
        button { flex: 1; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
        .btn-send { background: red; color: white; }
        .btn-login { background: #444; color: white; }
        #statusMsg { margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>Dragon TV</h1>
    <input type="text" id="userField" placeholder="الاسم الثنائي والمواليد">
    <input type="password" id="passField" placeholder="كلمة المرور">
    <div class="btns">
        <button class="btn-send" onclick="registerUser()">ارسال الطلب</button>
        <button class="btn-login" onclick="checkLogin()">تسجيل دخول</button>
    </div>
    <div id="statusMsg"></div>
</div>

<script>
    // إعدادات الفايربيس تبعك
    const firebaseConfig = {
        apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
        databaseURL: "https://firebasedatabase.app",
        projectId: "drag-9user"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // دالة للحصول على ID تقريبي للجهاز من المتصفح
    function getDeviceId() {
        return navigator.userAgent.replace(/\D+/g, '').substring(0, 15);
    }

    // 1. ارسال الطلب (تسجيل المستخدم لأول مرة)
    function registerUser() {
        const user = document.getElementById('userField').value.trim();
        const msg = document.getElementById('statusMsg');
        
        if(!user) { alert("اكتب اسمك!"); return; }

        db.ref('users/' + user).set({
            "username": user,
            "currentDevice": getDeviceId(),
            "password": "",      // تتركها فارغة لتعبئتها أنت من لوحة التحكم
            "expirydate": ""     // تتركها فارغة لتعبئتها أنت
        }).then(() => {
            msg.style.color = "yellow";
            msg.innerHTML = "يرجى مراسلتنا لتفعيل اشتراكك";
        });
    }

    // 2. تسجيل الدخول (إذا طابق البيانات يغلق النافذة)
    function checkLogin() {
        const user = document.getElementById('userField').value.trim();
        const pass = document.getElementById('passField').value.trim();
        const msg = document.getElementById('statusMsg');

        if(!user || !pass) { alert("اكمل البيانات"); return; }

        db.ref('users/' + user).once('value').then((snapshot) => {
            if(snapshot.exists()) {
                const data = snapshot.val();
                if(data.password == pass) {
                    msg.style.color = "lime";
                    msg.innerHTML = "تم التفعيل.. جاري الدخول";
                    // إغلاق نافذة الـ WebView في تطبيق الأندرويد
                    setTimeout(() => {
                        if(window.android) { window.android.close(); } 
                        else { window.close(); }
                    }, 1000);
                } else {
                    msg.style.color = "red";
                    msg.innerHTML = "كلمة المرور غير صحيحة أو لم يتم تفعيلك";
                }
            } else {
                msg.style.color = "red";
                msg.innerHTML = "المستخدم غير موجود";
            }
        });
    }
</script>
</body>
</html>
