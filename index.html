        body { 
            background-color: #000; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #222;
            border-top: 5px solid #ff0000; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .dragon-card { 
            display: none; 
            background: rgba(17,17,17,0.95); 
            padding: 30px; 
            border-radius: 15px; 
            border-top: 4px solid #ff0000; 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 0 25px rgba(255,0,0,0.3); 
            position: relative;
        }
        
        h1 { 
            color: #ff0000; 
            margin-bottom: 20px; 
            text-shadow: 0 0 10px #ff0000; 
            font-size: 2em; 
        }

        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            background: #222; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 10px; 
            box-sizing: border-box; 
            text-align: center; 
            outline: none; 
            font-size: 1em;
        }

        .btns { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 14px; cursor: pointer; font-weight: bold; border-radius: 10px; border: none; transition: 0.3s; outline: none; font-size: 1em; }

        .btn-reg { background: #353570; color: white; }
        .btn-log { background: #3a7035; color: white; }
        .btn-out { background: #b00; color: white; display: none; width: 100%; outline: none; }

        #statusMsg { margin-top: 15px; font-size: 14px; min-height: 20px; }

        /* أيقونات الاتصال مصغرة في أعلى يسار */
        .contact-icons {
            position: absolute; top: 10px; left: 10px;
            display: flex; gap: 10px;
        }
        .contact-icons a {
            display: block;
            width: 25px; height: 25px;
            border-radius: 8px;
            overflow: hidden;
            transition: 0.3s;
        }
        .contact-icons a img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .contact-icons a:focus { 
            outline: 2px solid #ff0000; 
            box-shadow: 0 0 10px #ff0000;
            transform: scale(1.05);
        }

        .contact-info {
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; font-size: 1em;
        }

        .tv-focusable:focus {
            border: 2px solid #ff0000 !important;
            box-shadow: 0 0 18px #ff0000 !important;
            transform: scale(1.03);
        }

        @media(max-width:600px) {
            .dragon-card { padding: 20px; width: 95%; }
            input, button { font-size: 0.95em; padding: 12px; }
            .contact-icons a { width: 30px; height: 30px; }
        }
    </style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
  authDomain: "drag-9user.firebaseapp.com",
  databaseURL: "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "drag-9user",
  storageBucket: "drag-9user.firebasestorage.app",
  messagingSenderId: "716759119906",
  appId: "1:716759119906:web:4b522ed58dba7bf623727b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function generateRandomID() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = "DRG-" + Math.floor(Math.random() * 1000000000) + "-" + Math.floor(Math.random() * 1000000000);
        localStorage.setItem('deviceId', id);
    }
    return id;
}
const deviceId = generateRandomID();

function showUI() {
    document.getElementById('loader').style.display = "none";
    document.getElementById('mainCard').style.display = "block";
    updateFocusableElements(); 
}

window.clearDeviceSession = function() {
    const user = localStorage.getItem("user");
    const msg = document.getElementById('statusMsg');
    if (user) {
        db.ref("users/" + user).once("value").then((snap) => {
            const data = snap.val();
            if (data && data.currentDevice === deviceId) {
                db.ref("users/" + user + "/currentDevice").set("").then(() => {
                    localStorage.clear();
                    alert("تم تسجيل الخروج بنجاح.");
                    if(window.Android) { window.Android.closeWindow(); } else { location.reload(); }
                });
            } else {
                msg.style.color = "orange";
                msg.innerText = "⚠ الجهاز غير مطابق لهذا الحساب";
            }
        });
    }
};

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const isLogoutMode = urlParams.get('action') === 'logout';
    const savedUser = localStorage.getItem("user");
    const savedPass = localStorage.getItem("pass");

    if(savedUser) { document.getElementById('userField').value = savedUser; }

    if (isLogoutMode && savedUser) {
        showUI();
        document.getElementById('userField').readOnly = true;
        document.getElementById('passField').style.display = "none";
        document.getElementById('mainBtns').style.display = "none";
        document.getElementById('outBtn').style.display = "block";
        updateFocusableElements();
    } else if(savedUser && savedPass) {
        processLogin(savedUser, savedPass, true);
    } else {
        showUI();
    }
};

function register() {
    const user = document.getElementById('userField').value.trim();
    const msg = document.getElementById('statusMsg');
    if(!user) { msg.style.color = "yellow"; msg.innerText = "⚠ يرجى إدخال أسم المستخدم أولاً"; return; }
    if(user.length < 8) { msg.style.color = "yellow"; msg.innerText = "⚠  الاسم يجب أن يكون ثنائي مع مواليد"; return; }
    
    db.ref("users/" + user).once("value").then((snap) => {
        if(snap.exists()) { 
            msg.style.color = "red"; msg.innerText = "⚠ هذا المستخدم موجود بالفعل"; 
        } else {
            db.ref("users/" + user).set({ username: user, currentDevice: deviceId, expirydate: "", password: "" }).then(() => {
                msg.style.color = "yellow"; msg.innerText = "تم إرسال طلبك بنجاح يرجى مراسلتنا";
            });
        }
    });
}

function login() {
    const user = document.getElementById('userField').value.trim();
    const pass = document.getElementById('passField').value.trim();
    const msg = document.getElementById('statusMsg');
    if(!user) { msg.style.color = "yellow"; msg.innerText = "⚠ يرجى إدخال اسم المستخدم"; return; }
    if(!pass) { msg.style.color = "yellow"; msg.innerText = "⚠ يرجى إدخال كلمة المرور"; return; }
    processLogin(user, pass, false);
}

function processLogin(user, pass, isAuto) {
    const msg = document.getElementById('statusMsg');
    db.ref("users/" + user).once("value").then((snap) => {
        if(snap.exists()){
            const data = snap.val();
            if(data.expirydate && new Date(data.expirydate) < new Date()) {
                
                msg.style.color = "yellow"; msg.innerText = "⚠ انتهى اشتراكك"; return;
            }
            if (!data.currentDevice || data.currentDevice === "") {
                db.ref("users/" + user + "/currentDevice").set(deviceId);
            } else if (data.currentDevice !== deviceId) {
                
                msg.style.color = "red"; msg.innerText = "⚠ حسابك مرتبط بجهاز آخر"; return;
            }
            if(data.password && data.password.toString() === pass) {
                localStorage.setItem("user", user);
                localStorage.setItem("pass", pass);
                if(window.Android) { window.Android.closeWindow(); }
            } else {
                 
                if(!isAuto) { msg.style.color = "yellow"; msg.innerText = "الباسورد خطأ"; }
            }
        } else {
            
            if(!isAuto) { msg.style.color = "yellow"; msg.innerText = "المستخدم غير موجود"; }
        }
    }).catch(() => showUI());
}

// ==========================================
// نظام التحكم بالريموت (TV Navigation System)
// ==========================================
let focusableElements = [];
let contactIcons = [];
let currentIndex = 0;
let onContactIcons = false;

// متغير لمراقبة حالة فتح الكيبورد
let isKeyboardOpen = false;

function updateFocusableElements() {
    // الحقول والأزرار
    focusableElements = Array.from(document.querySelectorAll('.tv-focusable')).filter(el => {
        return window.getComputedStyle(el).display !== 'none' && window.getComputedStyle(el.parentElement).display !== 'none';
    });

    // تهيئة حقول الإدخال بشكل يمنع النظام من التعرف عليها كحقول نصية نشطة أثناء التنقل
    focusableElements.forEach(el => {
        if (el.tagName === 'INPUT') {
            el.setAttribute('inputmode', 'none'); // منع كيبورد الموبايل والشاشات الحديثة
            
            // إلغاء أحداث اللمس والضغط العشوائي لكي لا يظهر الكيبورد إلا بطلبنا
            el.addEventListener('mousedown', function(e) { if(!isKeyboardOpen) { e.preventDefault(); el.focus(); } });
            el.addEventListener('touchstart', function(e) { if(!isKeyboardOpen) { e.preventDefault(); el.focus(); } });
        }
    });

    // أيقونات الاتصال
    contactIcons = Array.from(document.querySelectorAll('.contact-icons a'));
    
    if(focusableElements.length > 0) {
        currentIndex = 0;
        onContactIcons = false;
        focusableElements[currentIndex].focus();
    }
}

document.addEventListener('keydown', function(e) {
    // إذا كان الكيبورد مفتوحاً وضغط المستخدم زر رجوع (4 أو 27)، نغلقه فوراً ونستأنف التنقل
    if (isKeyboardOpen && (e.keyCode === 4 || e.keyCode === 27)) {
        let activeEl = document.activeElement;
        if (activeEl && activeEl.tagName === 'INPUT') {
            isKeyboardOpen = false;
            activeEl.setAttribute('inputmode', 'none'); // إعادة حظر الكيبورد
            activeEl.blur(); // إجبار المتصفح على إخفاء الكيبورد
            
            // إعادة التركيز للحقل برمجياً بعد ثوانٍ بسيطة ليظل المستخدم واقفا عليه ويكمل تنقله
            setTimeout(() => {
                activeEl.focus();
            }, 100);
            
            e.preventDefault();
            return; // إنهاء الحدث هنا لكي لا يغلق التطبيق بالكامل
        }
    }

    // إذا كان الكيبورد مفتوحاً والمستخدم يكتب داخل الحقل، نترك الأزرار تعمل للكتابة ولا نتدخل في التنقل
    if (isKeyboardOpen && document.activeElement.tagName === 'INPUT') {
        // إذا ضغط انتر داخل الحقل وهو مفتوح، نعتبره إنهاء للكتابة ونغلق الكيبورد
        if (e.keyCode === 13) {
            isKeyboardOpen = false;
            document.activeElement.setAttribute('inputmode', 'none');
            document.activeElement.blur();
            let savedEl = focusableElements[currentIndex];
            setTimeout(() => { savedEl.focus(); }, 100);
            e.preventDefault();
        }
        return; 
    }

    if(onContactIcons) {
        // التنقل بين أيقونات الاتصال
        switch(e.keyCode){
            case 37: // يسار
                currentIndex = (currentIndex > 0) ? currentIndex - 1 : contactIcons.length - 1;
                contactIcons[currentIndex].focus();
