<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Dragon TV Services</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { background-color: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        /* واجهة التحميل الذكية */
        #splashOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .loader { border: 4px solid #333; border-top: 4px solid #ff0000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .dragon-card { background: #111; padding: 30px; border-radius: 15px; border-top: 4px solid #ff0000; width: 320px; text-align: center; box-shadow: 0 0 20px rgba(255,0,0,0.3); display: none; } /* مخفية افتراضياً */
        h1 { color: #ff0000; margin-bottom: 20px; text-shadow: 0 0 10px #ff0000; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; text-align: center; }
        .btns { display: flex; gap: 5px; }
        button { flex: 1; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 8px; border: none; transition: 0.3s; }
        .btn-reg { background: #ff0000; color: white; }
        .btn-log { background: #333; color: white; }
        .btn-out { background: #b00; color: white; display: none; width: 100%; }
        #statusMsg { margin-top: 15px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

<!-- شاشة الانتظار أثناء التحقق -->
<div id="splashOverlay">
    <div class="loader"></div>
    <p style="margin-top: 15px; color: #ff0000; font-weight: bold;">جاري التحقق من البيانات...</p>
</div>

<div id="mainCard" class="dragon-card">
    <h1>Dragon TV</h1>
    <input type="text" id="userField" placeholder="الاسم الثنائي والمواليد">
    <input type="password" id="passField" placeholder="كلمة المرور">
    <div id="mainBtns" class="btns">
        <button class="btn-reg" onclick="register()">ارسال الطلب</button>
        <button class="btn-log" onclick="login()">تسجيل دخول</button>
    </div>
    <button id="outBtn" class="btn-out" onclick="clearDeviceSession()">تسجيل خروج من الحساب</button>
    <div id="statusMsg"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
  authDomain: "drag-9user.firebaseapp.com",
  databaseURL: "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "drag-9user",
  storageBucket: "drag-9user.firebasestorage.app",
  messagingSenderId: "716759119906",
  appId: "1:716759119906:web:4b522ed58dba7bf623727b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = "DRG-" + Math.floor(Math.random() * 1000000000) + "-" + Math.floor(Math.random() * 1000000000);
        localStorage.setItem('deviceId', id);
    }
    return id;
}
const deviceId = getDeviceId();

// إظهار الواجهة عند فشل التحقق الصامت
function showUI() {
    document.getElementById('splashOverlay').style.display = 'none';
    document.getElementById('mainCard').style.display = 'block';
}

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const isLogoutMode = urlParams.get('action') === 'logout';
    const savedUser = localStorage.getItem("user");
    const savedPass = localStorage.getItem("pass");

    if (isLogoutMode && savedUser) {
        showUI();
        document.getElementById('userField').value = savedUser;
        document.getElementById('userField').readOnly = true;
        document.getElementById('passField').style.display = "none";
        document.getElementById('mainBtns').style.display = "none";
        document.getElementById('outBtn').style.display = "block";
    } else if(savedUser && savedPass) {
        // فحص صامت بالخلفية
        processLogin(savedUser, savedPass, true);
    } else {
        showUI(); // مستخدم جديد
    }
};

function processLogin(user, pass, isAuto) {
    const msg = document.getElementById('statusMsg');
    db.ref("users/" + user).once("value").then((snap) => {
        if(snap.exists()){
            const data = snap.val();
            
            // شروط الفشل: تاريخ، باسورد، أو جهاز مختلف
            const isExpired = data.expirydate && new Date(data.expirydate) < new Date();
            const isWrongPass = data.password.toString() !== pass;
            const isWrongDevice = data.currentDevice && data.currentDevice !== "" && data.currentDevice !== deviceId;

            if (isExpired || isWrongPass || isWrongDevice) {
                showUI();
                if(isExpired) msg.innerText = "⚠ انتهى اشتراكك";
                if(isWrongPass) msg.innerText = "⚠ كلمة المرور تغيرت";
                if(isWrongDevice) msg.innerText = "⚠ الحساب مفتوح على جهاز آخر";
                return;
            }

            // ربط تلقائي إذا كان الحقل فارغاً
            if (!data.currentDevice || data.currentDevice === "") {
                db.ref("users/" + user + "/currentDevice").set(deviceId);
            }

            // نجاح التحقق الصامت أو اليدوي
            localStorage.setItem("user", user);
            localStorage.setItem("pass", pass);
            if(window.Android) { window.Android.closeWindow(); }
        } else {
            showUI();
            if(!isAuto) msg.innerText = "المستخدم غير موجود";
        }
    }).catch(() => {
        showUI(); // فشل الاتصال
    });
}

// باقي الدوال الأصلية (register, login, clearDeviceSession) كما هي في كودك
function login() {
    const user = document.getElementById('userField').value.trim();
    const pass = document.getElementById('passField').value.trim();
    if(!user || !pass) return;
    processLogin(user, pass, false);
}

function register() {
    const user = document.getElementById('userField').value.trim();
    if(user.length < 8) return;
    db.ref("users/" + user).set({
        username: user, currentDevice: deviceId, expirydate: "", password: ""
    }).then(() => { document.getElementById('statusMsg').innerText = "تم إرسال الطلب"; });
}

window.clearDeviceSession = function() {
    const user = localStorage.getItem("user");
    if (user) {
        db.ref("users/" + user + "/currentDevice").set("").then(() => {
            localStorage.clear();
            alert("تم تسجيل الخروج بنجاح.");
            if(window.Android) { window.Android.closeWindow(); } else { location.reload(); }
        });
    }
};
</script>
</body>
</html>
